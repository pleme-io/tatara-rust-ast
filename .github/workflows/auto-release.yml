# Auto-release shim for the macro-farm engine itself.
#
# Per the ★★ AUTO-RELEASE directive, every packaged pleme-io artifact
# ships to its upstream registry automatically on merge. tatara-rust-ast
# is a 16-crate Rust workspace; member crates publish to crates.io
# via substrate's rust-auto-release reusable workflow.
#
# The engine eats its own dog food: it's a Rust workspace that
# generates publishable Rust crates, so it ships through the same
# AUTO-RELEASE pipeline its emitted crates do.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch
  # Drip the new-crate bootstrap: a push (full mode) ships the burst +
  # rides ~30m of refills, then this */15 cron tick (drip mode) publishes
  # whatever capacity has refilled, idempotently, until every member is on
  # crates.io. ~15m sits just above crates.io's new-crate refill so no
  # capacity is left on the table; once converged each tick is a few
  # already-published HEADs and exits in seconds (negligible cost).
  schedule:
    - cron: "*/15 * * * *"

jobs:
  release:
    # The reusable workflow gates on github.event_name: push/dispatch = full
    # bump+ship (rides the rate limit in-job); the */15 schedule = publish-only
    # capacity drip. Nothing to pass here — it reads the triggering event.
    uses: pleme-io/substrate/.github/workflows/rust-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
      source-paths: "Cargo.toml Cargo.lock crates"
      add-paths: "Cargo.toml Cargo.lock crates"
    secrets: inherit
