[package]
name        = "tatara-rust-test"
description = "L3 test scaffolding — given a ProcDeriveSpec, materialize trybuild + insta + proptest fixtures in a temp dir + drive cargo test. Lets `(defprocderive …)` ship with provable correctness by construction."
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true
homepage     .workspace = true
authors      .workspace = true

[dependencies]
tatara-rust-ast         .workspace = true
tatara-rust-derive      .workspace = true
tatara-rust-proc-attr   .workspace = true
tatara-rust-proc-fn     .workspace = true
tatara-rust-macro-rules .workspace = true
tatara-rust-suite       .workspace = true
tatara-rust-composite   .workspace = true
tatara-rust-flake       .workspace = true
tatara-rust-caixa       .workspace = true
tatara-rust-dsl         .workspace = true
tatara-rust-validate    .workspace = true
tatara-rust-catalog     .workspace = true
tatara-rust-attr        .workspace = true
tatara-rust-examples    .workspace = true
thiserror               .workspace = true

[dev-dependencies]
insta    .workspace = true
proptest .workspace = true

[lints]
workspace = true
