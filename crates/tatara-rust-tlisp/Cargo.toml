[package]
name        = "tatara-rust-tlisp"
description = "Tlisp authoring surface for every L2 macro Spec. Round-trips between Spec ↔ `(def<kind> …)` text. When tatara-lisp is plugged in (one `#[derive(DeriveTataraDomain)]` line per Spec), these structs auto-register as Lisp authoring keywords."
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true
homepage     .workspace = true
authors      .workspace = true

[dependencies]
tatara-rust-ast         .workspace = true
tatara-rust-derive      .workspace = true
tatara-rust-proc-attr   .workspace = true
tatara-rust-proc-fn     .workspace = true
tatara-rust-macro-rules .workspace = true
tatara-rust-suite       .workspace = true
tatara-rust-catalog     .workspace = true
tatara-rust-composite   .workspace = true
serde                   .workspace = true
serde_json              .workspace = true
thiserror               .workspace = true

[lints]
workspace = true
