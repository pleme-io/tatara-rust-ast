[package]
name        = "tatara-rust-verify"
description = "Auto-emit a consumer-verify Cargo crate per MacroCatalogSpec. Given the N decorated repos compiled by tatara-rust-repo, generates one umbrella crate that depends on every emitted derive and exercises it under `cargo test`. The catalog's own verification harness is itself generated."
version      .workspace = true
edition      .workspace = true
rust-version .workspace = true
license      .workspace = true
repository   .workspace = true
homepage     .workspace = true
authors      .workspace = true

[dependencies]
tatara-rust-ast      .workspace = true
tatara-rust-derive   .workspace = true
tatara-rust-catalog  .workspace = true
tatara-rust-composite .workspace = true
serde                .workspace = true
proc-macro2          .workspace = true
quote                .workspace = true
syn                  .workspace = true
prettyplease         .workspace = true
toml                 .workspace = true

[dev-dependencies]
tatara-rust-snapshot .workspace = true

[lints]
workspace = true
